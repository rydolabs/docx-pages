name: Reusable release verification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-fixtures-build:
    name: Unit + fixture integrity + build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static analysis, unit tests, fixture checks, static build
        run: npm run test:ci
      - name: Preserve static site for deploy after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: docx-pages-site
          path: dist/site/
          if-no-files-found: error
          retention-days: 7
  browser-regression:
    name: Chromium corpus (51) + geometry (37) + website smoke
    needs: unit-fixtures-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser test dependencies and reference fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-croscore fonts-crosextra-carlito fonts-noto-core fonts-noto-cjk fonts-baekmuk
          fc-cache -f
      - name: Download the build from the unit job
        uses: actions/download-artifact@v4
        with:
          name: docx-pages-site
          path: dist/site
      - name: Check generated site with a real DOCX upload
        run: npm run test:browser:site
      - name: Verify actual DOCX corpus in Chromium
        run: npm run test:browser
      - name: Compare frozen regression geometry
        run: npm run test:geometry
      - name: Archive measurements for failed and passed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-pages-test-results
          path: |
            tests/results/
            tests/regression/visual/summary.json
          if-no-files-found: warn
          retention-days: 14
